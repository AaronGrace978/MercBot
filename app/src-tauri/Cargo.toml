[package]
name = "mercbot-acid-runtime"
version = "0.3.0"
description = "MercBot // Punk Frontier Agent Runtime powered by Mercury Harness"
authors = ["Aaron Grace <aarongrace978@gmail.com>"]
edition = "2021"

[lib]
name = "mercbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
