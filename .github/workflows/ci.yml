name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]" -e ./runtime -e ./forge
      - name: Tests
        run: python -m pytest -q
      - name: Demo smoke
        run: mercury demo > /dev/null
      - name: Grade smoke
        run: mercury grade examples/traces/opus-auth.json

  flywheel-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the flywheel alone
        run: pip install -e ".[dev]"
      - name: Tests (runtime and forge suites skip)
        run: python -m pytest -q -rs
      - name: Demo smoke
        run: mercury demo > /dev/null
      - name: Add-on commands fail with an install hint
        run: |
          set +e
          mercury models
          test $? -eq 2
